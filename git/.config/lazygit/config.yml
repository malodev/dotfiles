customCommands:
  - key: "Z"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal

# Remote model, e.g. OpenRouter / OpenAI / Msty – whatever you configured as "my-remote"
  - key: '<c-a>'
    description: 'AI commit'
    context: 'files'
    command: 'ai-commit'
    loadingText: 'Generating commit message with remote model...'

    # for nvim terminal integration
keybinding:
  universal:
    return: <esc>
gui:
  theme:
    activeBorderColor:
      - "#cba6f7"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#7F839C"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#cba6f7"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
  authorColors:
    "*": "#b4befe"
  nerdFontsVersion: "3"
git:
  pagers:
    - colorArg: never
      pager: delta --dark --paging=never

# Install on the GPU host as /etc/nginx/sites-enabled/pi-inference-control.conf.
# Remote clients authenticate with a dedicated high-entropy control bearer.
server {
    listen 80;
    listen [::]:80;
    server_name inference.malo.tn.it;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name inference.malo.tn.it;

    ssl_certificate /etc/letsencrypt/live/@malo.tn.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@malo.tn.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The manager enforces a control-only bearer distinct from every model key.
    # TLS protects it in transit; redirects are refused by the shared client.

    add_header Strict-Transport-Security "max-age=31536000" always;
    # Lease IDs are bearer-like secrets in request paths; manager audit logs omit them.
    access_log off;

    location /v1/ {
        proxy_pass http://127.0.0.1:46758;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240;
        proxy_send_timeout 240;
        client_max_body_size 64k;
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"message":"Only /v1 control routes are exposed"}}';
    }
}

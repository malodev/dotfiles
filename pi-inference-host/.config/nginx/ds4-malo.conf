# HTTP -> HTTPS redirect for the DeepSeek V4 Flash (ds4.c) inference API.
server {
    listen 80;
    listen [::]:80;
    server_name ds4.malo.tn.it;
    return 301 https://$host$request_uri;
}

# OpenAI-compatible ds4-server API. ds4-server has no built-in authentication,
# so this vhost delegates bearer validation to pi-inference-manager's
# /v1/model-auth endpoint (the same model API key used for llm.malo.tn.it)
# via auth_request before proxying.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ds4.malo.tn.it;

    ssl_certificate /etc/letsencrypt/live/@malo.tn.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@malo.tn.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /v1/ {
        auth_request /internal/model-auth;
        error_page 401 = @model_unauthorized;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        client_max_body_size 32M;

        proxy_intercept_errors on;
        error_page 502 503 504 = @ds4_unavailable;
    }

    location = /internal/model-auth {
        internal;
        proxy_pass http://127.0.0.1:46758/v1/model-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location @model_unauthorized {
        default_type application/json;
        return 401 '{"error":{"message":"Invalid or missing model API key","type":"unauthorized"}}';
    }

    location @ds4_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        return 503 '{"error":{"message":"ds4 is offline; run \x27pi-inference ds4\x27 to switch this host to ds4 mode","type":"service_unavailable"}}';
    }

    location / {
        default_type application/json;
        return 404 '{"error":{"message":"Only the OpenAI-compatible /v1 API is exposed","type":"not_found"}}';
    }
}

# GPU-host-only inference manager configuration.
[server]
unix_socket = "${XDG_RUNTIME_DIR}/pi-inference-manager.sock"
tcp_host = "127.0.0.1"
tcp_port = 46758
control_token_file = "~/.pi-inference/credentials/control-api-token"
state_file = "${STATE_DIRECTORY}/state.json"

[services]
router_unit = "pi-llama-router.service"
studio_unit = "unsloth.service"
router_health_url = "http://127.0.0.1:46757/v1/models"
router_api_key_file = "~/.pi-inference/credentials/model-api-key"
transition_timeout_seconds = 180

[lease]
minimum_ttl_seconds = 30
default_ttl_seconds = 300
maximum_ttl_seconds = 3600

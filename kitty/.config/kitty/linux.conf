editor /usr/bin/nvim

# Remote-control socket for `kitty @` / global keybindings (omarchy).
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Follow the Omarchy theme (the file is regenerated on every `omarchy theme set`;
# omarchy-restart-terminal sends SIGUSR1 so kitty recolors without a restart).
include ~/.local/state/omarchy/current/theme/kitty.conf

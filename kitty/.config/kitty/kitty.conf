#  List of supported fonts: `kitty : +list-fonts`
font_family      family='JetBrainsMono Nerd Font' style=Light
bold_font        family='JetBrainsMono Nerd Font' style=Medium
italic_font      family='JetBrainsMono Nerd Font' style='Light Italic'
bold_italic_font family='JetBrainsMono Nerd Font' style='Medium Italic'

#: Font size (in pts)
font_size 20.0

disable_ligatures cursor

clipboard_control write-clipboard write-primary read-clipboard read-primary

# Background opacity, 0.0 to 1.0
background_opacity 0.8

dynamic_background_opacity yes

# Keyboard shortcut
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 6
map ctrl+0 goto_tab 0


# BEGIN_KITTY_THEME
# zenwritten_dark
include base2tone-lavender-dark.conf
# END_KITTY_THEME

# BEGIN_KITTY_OS_CONFIG
include ${KITTY_OS}.conf
# BEGIN_KITTY_OS_CONFIG

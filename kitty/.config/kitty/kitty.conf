#  List of supported fonts: `kitty : +list-fonts`
# font_family      family='JetBrainsMono Nerd Font Mono' style=Light
# bold_font        family='JetBrainsMono Nerd Font Mono' style=Medium
# italic_font      family='JetBrainsMono Nerd Font Mono' style='Light Italic'
# bold_italic_font family='JetBrainsMono Nerd Font Mono' style='Medium Italic'

#: Font size (in pts)
font_size 18.0

# modify_font cell_height +5px
adjust_line_height 110%

disable_ligatures cursor

clipboard_control write-clipboard write-primary read-clipboard read-primary

focus_follows_mouse yes

# Enable remote control so you can run commands like:
#   k   (vertical split)
#   kitty @ launch --location=hsplit   (horizontal split)
#   kitty @ layout_action rotate       (rotate split)
allow_remote_control yes

# Background opacity, 0.0 to 1.0
background_opacity 0.95

dynamic_background_opacity yes

enabled_layouts splits
active_layout splits

# Keyboard shortcut
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 6
map ctrl+0 goto_tab 0

map shift+enter send_text all \x1b[13;2u

tab_bar_style powerline
tab_powerline_style round

# BEGIN_KITTY_THEME
# zenwritten_dark
#include base2tone-lavender-dark.conf
include rose-pine.conf
# END_KITTY_THEME

# BEGIN_KITTY_OS_CONFIG
include ${KITTY_OS}.conf
# BEGIN_KITTY_OS_CONFIG

# Emoji
symbol_map U+1F000-U+1F9FF Noto Color Emoji
symbol_map U+26A0 Noto Color Emoji

# Nerd Font and Powerline glyphs
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 Symbols Nerd Font Mono

# Pi powerline footer and prompt markers
symbol_map U+2387 Noto Sans Symbols
symbol_map U+21B3,U+21BB Noto Sans Math

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' style=Thin
bold_font        family='JetBrainsMono Nerd Font' style=Light
italic_font      family='JetBrainsMono Nerd Font' style='Thin Italic'
bold_italic_font family='JetBrainsMono Nerd Font' style='Light Italic'
# END_KITTY_FONTS

# 1Password Kitten Configuration
# Primary hotkey - fuzzy search through all 1Password items
map ctrl+alt+1 kitten onepassword_kitten.py

map f5 launch --location=hsplit
map f6 launch --location=vsplit
map f7 layout_action rotate

# Move the active window in the indicated direction
# map shift+up move_window up
# map shift+left move_window left
# map shift+right move_window right
# map shift+down move_window down
#
# # Move the active window to the indicated screen edge
# map ctrl+shift+up layout_action move_to_screen_edge top
# map ctrl+shift+left layout_action move_to_screen_edge left
# map ctrl+shift+right layout_action move_to_screen_edge right
# map ctrl+shift+down layout_action move_to_screen_edge bottom
#
# # Switch focus to the neighboring window in the indicated direction
# map ctrl+left neighboring_window left
# map ctrl+right neighboring_window right
# map ctrl+up neighboring_window up
# map ctrl+down neighboring_window down
#
# # Set the bias of the split containing the currently focused window. The
# # currently focused window will take up the specified percent of its parent
# # window's size.
# map ctrl+. layout_action bias 80
#
# # Maximize the active window along the horizontal axis (fill full width),
# # keeping other windows visible in their vertical positions. Press again to
# # restore the original layout.
# map ctrl+shift+right layout_action maximize horizontal
#
# # Maximize the active window along the vertical axis (fill full height),
# # keeping other windows visible in their horizontal positions. Press again
# # to restore the original layout.
# map ctrl+shift+up layout_action maximize vertical

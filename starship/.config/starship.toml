# Show this module ONLY when NOT in SSH
[custom.hostname_local]
command = "echo $DOTFILES_HOSTNAME"
when = '[ -z "$SSH_CONNECTION" ]' # Triggers if the variable is empty
style = "bold #595B71"
format = "[$output]($style) "

# Show this module ONLY when in SSH
[custom.hostname_ssh]
command = "echo $DOTFILES_HOSTNAME"
when = '[ -n "$SSH_CONNECTION" ]' # Triggers if the variable is NOT empty
style = "bold #f38ba8"  # red from catppuccin_mocha
format = "[$output]($style) "


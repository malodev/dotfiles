"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"
# right_format = """$battery $time"""
format = """$os $username${custom.hostname_local}${custom.hostname_ssh} $directory $git_branch $git_status $python
$character"""
command_timeout = 5000
# Starship modules
[character]
# Note the use of Catppuccin color 'peach'
#success_symbol = "[[󰄛](green) ❯](blue)"
#error_symbol = "[[󰄛](red) ❯](blue)"
#vimcmd_symbol = "[󰄛 ❮](subtext1)" # For use with zsh-vi-mode
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[󰕷](bold fg:peach)'
vimcmd_replace_one_symbol = '[󰕷](bold fg:purple)'
vimcmd_replace_symbol = '[󰕷](bold fg:purple)'
vimcmd_visual_symbol = '[󰕷](bold fg:lavender)'

[cmd_duration]
style = "surface2"
format = '[\($duration\)]($style) '

[git_branch]
symbol = " "
style = "bold mauve"
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = "lavender"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = '[🏳](red)'
#up_to_date = '[✓](green)'
untracked = ':${count}'
stashed = ' :${count} '
modified = ' :${count} '
staged = '[++\($count\)](green)'
renamed = '${count}󰾵'
deleted = '[${count}🗑](lavender)'
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'


[directory]
read_only = " 󰌾"
#truncation_length = 4
style = "bold lavender"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Develop" = "󰲋 "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"

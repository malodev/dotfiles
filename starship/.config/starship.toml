[os]
disabled = false

[username]
disabled = false
show_always = true
style_user = "bg:base fg:lavender"
style_root = "bold bg:base fg:red"
format = '[$user]($style)@'

[time]
disabled = true
style = "surface2"
#style = "bg:peach"
#format = '🕙 [$time]($style) '
#format = '[ $time]($style) '
#time_format = '%T'
time_format = "%R"
# format = '[[  $time ](fg:mantle bg:purple)]($style)'



# Lightweight starship config for constrained machines
# (shared hosting, low-spec VPS, etc.)
# This drops slow fork-heavy modules and uses tighter timeouts.

"$schema" = 'https://starship.rs/config-schema.json'
palette = "catppuccin_mocha"

# Only modules that are fast — no git_status, python, or custom hostname forks
format = """$username$hostname $directory $git_branch$git_commit$character"""

# Tight timeout — never block the prompt for more than 500ms
command_timeout = 500

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[󰕷](bold fg:peach)'

[username]
show_always = true
style_user = "bg:base fg:lavender"
format = '[$user]($style)@'

[hostname]
ssh_only = false
ssh_symbol = ""
format = '[$hostname]($style) '
style = "bold #595B71"

[directory]
read_only = " 󰌾"
style = "bold lavender"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = " "
style = "bold mauve"
format = '[$symbol$branch]($style) '

# git_commit is fast (reads HEAD) unlike git_status (scans worktree)
[git_commit]
tag_symbol = "  "
style = "lavender"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = true

[os.symbols]
Alpaquita = " "
Alpine = " "
Arch = " "
Debian = " "
Fedora = " "
Linux = " "
Macos = " "
Ubuntu = " "

[nodejs]
symbol = ""
style = "mauve"
format = '[$symbol]($style)[$version](surface2) '

onboarding = false
[keys]
prefix = "ctrl+space"
switch_workspace = "prefix+1..9"
switch_tab = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[experimental]
pane_history = true
kitty_graphics = true

[ui]
agent_panel_sort = "spaces"

show_agent_labels_on_pane_borders = false
[ui.toast]
delivery = "system"

[theme]
# "terminal" = follow the host terminal palette, which Omarchy regenerates on
# every `omarchy theme set` (kitty/alacritty/ghostty/foot).
name = "terminal"
auto_switch = false

# Herdr's "terminal" theme maps accent -> ANSI 4 and overlay0 -> ANSI 7, which
# the active/inactive pane borders use. In dark themes whose ANSI 4 is a muted
# colour (blackgold: #6E6A58) and ANSI 7 is bright (blackgold: #F6F1DD) that
# inverts the emphasis: the focused pane looks dim and the others highlighted.
# Pin the two tokens to the palette's bright/dark slots instead.
[theme.custom]
accent = "lightmagenta"   # focused pane border + highlights (theme's bright slot)
overlay0 = "darkgray"     # unfocused pane borders

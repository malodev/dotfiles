# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-or-focus btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"
# This will toggle HyprExpo when SUPER+g is pressed
# bindd = SUPER, g, Expo, hyprexpo:expo, toggle

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Workspaces 11-20: SUPER+CTRL+[1-0]
bindd = SUPER CTRL, code:10, Switch to workspace 11, workspace, 11
bindd = SUPER CTRL, code:11, Switch to workspace 12, workspace, 12
bindd = SUPER CTRL, code:12, Switch to workspace 13, workspace, 13
bindd = SUPER CTRL, code:13, Switch to workspace 14, workspace, 14
bindd = SUPER CTRL, code:14, Switch to workspace 15, workspace, 15
bindd = SUPER CTRL, code:15, Switch to workspace 16, workspace, 16
bindd = SUPER CTRL, code:16, Switch to workspace 17, workspace, 17
bindd = SUPER CTRL, code:17, Switch to workspace 18, workspace, 18
bindd = SUPER CTRL, code:18, Switch to workspace 19, workspace, 19
bindd = SUPER CTRL, code:19, Switch to workspace 20, workspace, 20
bindd = SUPER CTRL SHIFT, code:10, Move window to workspace 11, movetoworkspace, 11
bindd = SUPER CTRL SHIFT, code:11, Move window to workspace 12, movetoworkspace, 12
bindd = SUPER CTRL SHIFT, code:12, Move window to workspace 13, movetoworkspace, 13
bindd = SUPER CTRL SHIFT, code:13, Move window to workspace 14, movetoworkspace, 14
bindd = SUPER CTRL SHIFT, code:14, Move window to workspace 15, movetoworkspace, 15
bindd = SUPER CTRL SHIFT, code:15, Move window to workspace 16, movetoworkspace, 16
bindd = SUPER CTRL SHIFT, code:16, Move window to workspace 17, movetoworkspace, 17
bindd = SUPER CTRL SHIFT, code:17, Move window to workspace 18, movetoworkspace, 18
bindd = SUPER CTRL SHIFT, code:18, Move window to workspace 19, movetoworkspace, 19
bindd = SUPER CTRL SHIFT, code:19, Move window to workspace 20, movetoworkspace, 20

# Voxtype translate toggle
bindd = SUPER CTRL, T, Toggle Voxtype translate mode, exec, voxtype-translate-toggle
# Screenshot: Omarchy native (grim + slurp + satty)
bindd = SUPER SHIFT, S, Screenshot, exec, omarchy-capture-screenshot

# hyprscrolling bindings
bind = SUPER, period, layoutmsg, move +col
bind = SUPER, comma, layoutmsg, move -col
bind = SUPER SHIFT, period, layoutmsg, movewindowto r
bind = SUPER SHIFT, comma, layoutmsg, movewindowto l
bind = SUPER SHIFT, up, layoutmsg, movewindowto u
bind = SUPER SHIFT, down, layoutmsg, movewindowto d


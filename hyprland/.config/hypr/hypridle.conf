general {
    # Disable automatic locking; idle should only start the screensaver.
    lock_cmd = true
    before_sleep_cmd = true
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 0
}

# Start screensaver after 30 minutes (was 2.5min — the screensaver's
# text-effects renderer burns significant CPU while active, which was
# measurably degrading GPU inference workloads running in the background)
listener {
    timeout = 1800
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

set $monitor_one "HDMI-0"
set $monitor_two "DVI-D-0"
exec --no-startup-id xrandr --output DVI-D-0 --rotate left
exec --no-startup-id xrandr --output $monitor_two --right-of $monitor_one
gaps inner 40
gaps outer 40

workspace 1 output $monitor_one
workspace 2 output $monitor_one
workspace 3 output $monitor_one
workspace 4 output $monitor_one
workspace 5 output $monitor_one
workspace 6 output $monitor_one
workspace 7 output $monitor_one
workspace 8 output $monitor_one
workspace 9 output $monitor_one
workspace 10 output $monitor_one
workspace 11 output $monitor_two
workspace 12 output $monitor_two
assign [title="Terminal Companion"] $ws1
assign [title="Main"] $ws2
assign [title="Main Companion"] $ws2
assign [title="Neovim"] $ws3
assign [title="Obsidian Companion"] $ws5
assign [title="Malo's"] $ws6
assign [title="Dev one"] $ws7
assign [title="Mobile Dev"] $ws8
assign [title="Dev two"] $ws9
assign [class="calibre"] $ws11
assign [title="Right Monitor"] $ws12

# Define names for default workspaces for which we configure key bindings later on.
# We use variables to avoid repeating the names in multiple places.
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"
set $ws6 "6"
set $ws7 "7"
set $ws8 "8"
set $ws9 "9"
set $ws10 "10"
set $ws11 "11"
set $ws12 "12"
set $ws13 "13"
set $ws14 "14"
set $ws15 "15"
set $ws16 "16"
set $ws17 "17"
set $ws18 "18"
set $ws19 "19"
set $ws20 "20"

# switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5
bindsym $mod+6 workspace number $ws6
bindsym $mod+7 workspace number $ws7
bindsym $mod+8 workspace number $ws8
bindsym $mod+9 workspace number $ws9
bindsym $mod+0 workspace number $ws10

bindsym $mod+Mod1+1 workspace number $ws11
bindsym $mod+Mod1+2 workspace number $ws12
bindsym $mod+Mod1+3 workspace number $ws13
bindsym $mod+Mod1+4 workspace number $ws14
bindsym $mod+Mod1+5 workspace number $ws15
bindsym $mod+Mod1+6 workspace number $ws16
bindsym $mod+Mod1+7 workspace number $ws17
bindsym $mod+Mod1+8 workspace number $ws18
bindsym $mod+Mod1+9 workspace number $ws19
bindsym $mod+Mod1+0 workspace number $ws20

# move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5
bindsym $mod+Shift+6 move container to workspace number $ws6
bindsym $mod+Shift+7 move container to workspace number $ws7
bindsym $mod+Shift+8 move container to workspace number $ws8
bindsym $mod+Shift+9 move container to workspace number $ws9

bindsym $mod+Mod1+Shift+1 move container to workspace number $ws11
bindsym $mod+Mod1+Shift+2 move container to workspace number $ws12
bindsym $mod+Mod1+Shift+3 move container to workspace number $ws13
bindsym $mod+Mod1+Shift+4 move container to workspace number $ws14
bindsym $mod+Mod1+Shift+5 move container to workspace number $ws15
bindsym $mod+Mod1+Shift+6 move container to workspace number $ws16
bindsym $mod+Mod1+Shift+7 move container to workspace number $ws17
bindsym $mod+Mod1+Shift+8 move container to workspace number $ws18
bindsym $mod+Mod1+Shift+9 move container to workspace number $ws19
bindsym $mod+Mod1+Shift+0 move container to workspace number $ws20
bindsym $mod+Shift+0 move container to workspace number $ws10
